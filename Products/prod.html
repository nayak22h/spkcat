<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spraytek Product Details and Showcase">
    <title>Product Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="productstylin.css">
</head>

<body>
    <header>
        <a href="../index.html"> <!-- Link to the home page -->
            <img src="../path/your/Spraytek_coatings.jpg" alt="Logo" class="logo">
        </a>
        <h1>Product Catalogs</h1>
        <nav>
            <a href="../index.html">Back to Main Page</a>
            <a href="../contact.html">Contact Me</a>
        </nav>
    </header>

    <div class="container">
        <!-- <div class="product-list">
            <h2>Select a Product:</h2>
            <ul>
                <li><a href="#" onclick="loadProduct('productA')">Product A</a></li>
                <li><a href="#" onclick="loadProduct('productB')">Product B</a></li>
                <li><a href="#" onclick="loadProduct('productC')">Product C</a></li>
            </ul>
        </div> -->

        <!-- Image Carousel -->
        <div class="product-details">
            <div class="carousel">
                <div class="slides" id="productImages">
                    <!-- Images will be dynamically inserted here -->
                </div>
            </div>
            <div class="dots" id="dots"></div>

            <div class="product-name" id="productName"></div>
            <div class="product-description" id="productDescription"></div>
            
            <button class="catalog-link" id="catalogBtn" style="cursor: pointer; border: none; font-family: inherit;">View Product Catalog</button>
            
            <!-- Inline PDF Viewer Container -->
            <div id="pdfContainer" style="display: none; margin-top: 2rem; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; height: 75vh; max-height: 800px; background-color: #f1f5f9;">
                <object id="pdfObject" data="" type="application/pdf" width="100%" height="100%" style="display: block;">
                    <iframe id="pdfFrameFallback" src="" width="100%" height="100%" style="border: none;">
                        <p style="padding: 2rem;">Your device does not support inline PDF viewing. <br><br> 
                            <a id="pdfDownloadLink" href="" style="color: #0c4a6e; font-weight: bold; text-decoration: underline;">Click here to download the PDF</a>
                        </p>
                    </iframe>
                </object>
            </div>
        </div>
    </div>

    <script src="product.js"></script> <!-- Link to the JavaScript file -->
</body>

</html>
