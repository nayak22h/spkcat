<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spraytek Product Details and Showcase">
    <title>Product Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="productstylin.css">
</head>

<body>
    <header>
        <div class="header-left">
            <a href="../index.html">
                <img src="../path/your/logo_new.png" alt="Logo" class="logo">
            </a>
        </div>
        <div class="header-center">
            <h1>Product Catalogs</h1>
            <nav>
                <a href="../index.html">Back to Main Page</a>
                <a href="../contact.html">Contact Me</a>
            </nav>
        </div>
        <div class="header-right">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="productSearch" placeholder="Search products..." autocomplete="off">
                </div>
                <ul id="autocompleteResults" class="autocomplete-dropdown hidden"></ul>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- <div class="product-list">
            <h2>Select a Product:</h2>
            <ul>
                <li><a href="#" onclick="loadProduct('productA')">Product A</a></li>
                <li><a href="#" onclick="loadProduct('productB')">Product B</a></li>
                <li><a href="#" onclick="loadProduct('productC')">Product C</a></li>
            </ul>
        </div> -->

        <!-- Image Carousel -->
        <div class="product-details">
            <div class="carousel">
                <div class="slides" id="productImages">
                    <!-- Images will be dynamically inserted here -->
                </div>
            </div>
            <div class="dots" id="dots"></div>

            <div class="product-name" id="productName"></div>
            <div class="product-description" id="productDescription"></div>
            
            <div class="pdf-container" id="pdfContainer">
                <iframe id="catalogFrame" class="catalog-frame" title="Product Catalog PDF"></iframe>
            </div>
            
            <div class="action-buttons">
                <a href="#" class="catalog-link" id="catalogLink" target="_blank">Download Catalog</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <p>Created and developed with <span class="heart">♥</span> by <span class="developer-name">Harshith H. Nayak</span></p>
        </div>
    </footer>

    <script src="data.js"></script> <!-- Synchronously inject JSON to bypass CORS -->
    <script src="../search.js"></script>
    <script src="product.js"></script> <!-- Link to the JavaScript file -->
</body>

</html>
